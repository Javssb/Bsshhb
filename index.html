<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAND ARAB</title>

<style>

body{
margin:0;
overflow:hidden;
background:black;
font-family:Arial;
touch-action:none;
}

#hud{
position:fixed;
top:10px;
left:10px;
color:white;
z-index:10;
font-size:18px;
background:rgba(0,0,0,0.5);
padding:10px;
border-radius:10px;
}

#shoot{
position:fixed;
bottom:40px;
right:30px;
width:90px;
height:90px;
border:none;
border-radius:50%;
background:red;
color:white;
font-size:30px;
z-index:10;
}

#jump{
position:fixed;
bottom:150px;
right:40px;
width:70px;
height:70px;
border:none;
border-radius:50%;
background:orange;
color:white;
font-size:20px;
z-index:10;
}

#joystick{
position:fixed;
bottom:40px;
left:30px;
width:120px;
height:120px;
border-radius:50%;
background:rgba(255,255,255,0.2);
z-index:10;
}

#stick{
position:absolute;
left:35px;
top:35px;
width:50px;
height:50px;
border-radius:50%;
background:white;
}

#menu{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
color:white;
z-index:100;
}

#menu h1{
font-size:60px;
margin:0;
}

#startGame{
padding:20px 40px;
font-size:30px;
border:none;
border-radius:10px;
background:red;
color:white;
margin-top:20px;
}

</style>
</head>

<body>

<div id="menu">
<h1>LAND ARAB</h1>
<p>Battle Royale Iraq 🔥</p>
<button id="startGame">START</button>
</div>

<div id="hud">
HP: 100<br>
Kills: 0<br>
Gun: AK
</div>

<button id="shoot">🔥</button>
<button id="jump">⬆</button>

<div id="joystick">
<div id="stick"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>

<script>

//////////////////////////////
// SOUNDS
//////////////////////////////

const walkSound = new Audio(
"https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3"
);

walkSound.loop = true;

const gunSound = new Audio(
"https://cdn.pixabay.com/download/audio/2022/03/10/audio_270adfcb1f.mp3"
);

//////////////////////////////
// SCENE
//////////////////////////////

const scene = new THREE.Scene();

scene.background = new THREE.Color(0xd2b48c);

const camera = new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
2000
);

const renderer = new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(
window.innerWidth,
window.innerHeight
);

renderer.shadowMap.enabled = true;

document.body.appendChild(renderer.domElement);

//////////////////////////////
// LIGHT
//////////////////////////////

const light = new THREE.DirectionalLight(
0xffffff,
1
);

light.position.set(20,30,10);

light.castShadow = true;

scene.add(light);

//////////////////////////////
// GROUND
//////////////////////////////

const ground = new THREE.Mesh(

new THREE.PlaneGeometry(500,500),

new THREE.MeshStandardMaterial({
color:0xc2b280
})

);

ground.rotation.x = -Math.PI/2;

ground.receiveShadow = true;

scene.add(ground);

//////////////////////////////
// PLAYER
//////////////////////////////

const player = new THREE.Mesh(

new THREE.BoxGeometry(1,2,1),

new THREE.MeshStandardMaterial({
color:0x00ff00
})

);

player.position.y = 1;

player.castShadow = true;

scene.add(player);

camera.position.set(0,5,8);

//////////////////////////////
// VARIABLES
//////////////////////////////

let velocityY = 0;
let gravity = -0.01;
let kills = 0;
let gunType = "AK";
let hp = 100;

let moveX = 0;
let moveZ = 0;

let driving = false;
let inPlane = true;

//////////////////////////////
// PLANE
//////////////////////////////

const plane = new THREE.Mesh(

new THREE.BoxGeometry(8,2,20),

new THREE.MeshStandardMaterial({
color:0x555555
})

);

plane.position.set(0,30,80);

scene.add(plane);

//////////////////////////////
// PARACHUTE
//////////////////////////////

const parachute = new THREE.Mesh(

new THREE.SphereGeometry(3),

new THREE.MeshStandardMaterial({
color:0xff0000
})

);

parachute.visible = false;

scene.add(parachute);

//////////////////////////////
// ENEMIES
//////////////////////////////

const enemies=[];

for(let i=0;i<10;i++){

const enemy = new THREE.Mesh(

new THREE.BoxGeometry(1,2,1),

new THREE.MeshStandardMaterial({
color:0xff0000
})

);

enemy.position.set(
Math.random()*100-50,
1,
Math.random()*-100
);

enemy.castShadow = true;

scene.add(enemy);

enemies.push(enemy);

}

//////////////////////////////
// BUILDINGS
//////////////////////////////

for(let i=0;i<40;i++){

const building = new THREE.Mesh(

new THREE.BoxGeometry(
Math.random()*5+2,
Math.random()*15+5,
Math.random()*5+2
),

new THREE.MeshStandardMaterial({
color:0x808080
})

);

building.position.set(
Math.random()*200-100,
5,
Math.random()*200-100
);

building.castShadow = true;

scene.add(building);

}

//////////////////////////////
// SAFE ZONE
//////////////////////////////

const zoneGeometry = new THREE.RingGeometry(
40,
41,
64
);

const zoneMaterial = new THREE.MeshBasicMaterial({
color:0x00ffff,
side:THREE.DoubleSide
});

const zone = new THREE.Mesh(
zoneGeometry,
zoneMaterial
);

zone.rotation.x = -Math.PI/2;

scene.add(zone);

let zoneSize = 40;

setInterval(()=>{

zoneSize -= 1;

zone.scale.set(
zoneSize/40,
zoneSize/40,
1
);

if(zoneSize < 10){

zoneSize = 40;

}

},3000);

//////////////////////////////
// CAR
//////////////////////////////

const car = new THREE.Mesh(

new THREE.BoxGeometry(3,1,5),

new THREE.MeshStandardMaterial({
color:0x0000ff
})

);

car.position.set(10,1,10);

scene.add(car);

//////////////////////////////
// AIRDROP
//////////////////////////////

const airDrop = new THREE.Mesh(

new THREE.BoxGeometry(2,2,2),

new THREE.MeshStandardMaterial({
color:0xff00ff
})

);

airDrop.position.set(
0,
20,
-30
);

scene.add(airDrop);

//////////////////////////////
// LOOT
//////////////////////////////

const lootBoxes=[];

for(let i=0;i<15;i++){

const loot = new THREE.Mesh(

new THREE.BoxGeometry(1,1,1),

new THREE.MeshStandardMaterial({
color:0xffff00
})

);

loot.position.set(
Math.random()*100-50,
0.5,
Math.random()*100-50
);

scene.add(loot);

lootBoxes.push(loot);

}

//////////////////////////////
// MEDKITS
//////////////////////////////

const medkits=[];

for(let i=0;i<5;i++){

const medkit = new THREE.Mesh(

new THREE.BoxGeometry(1,1,1),

new THREE.MeshStandardMaterial({
color:0x00ffff
})

);

medkit.position.set(
Math.random()*50-25,
0.5,
Math.random()*50-25
);

scene.add(medkit);

medkits.push(medkit);

}

//////////////////////////////
// JOYSTICK
//////////////////////////////

const joystick = document.getElementById("joystick");

joystick.addEventListener(
"touchmove",
(e)=>{

const touch = e.touches[0];

const rect = joystick.getBoundingClientRect();

const x = touch.clientX - rect.left - 60;
const y = touch.clientY - rect.top - 60;

moveX = x * 0.01;
moveZ = y * 0.01;

}
);

joystick.addEventListener(
"touchend",
()=>{

moveX = 0;
moveZ = 0;

}
);

//////////////////////////////
// START GAME
//////////////////////////////

document.getElementById(
"startGame"
).onclick=()=>{

document.getElementById(
"menu"
).style.display="none";

};

//////////////////////////////
// PARACHUTE
//////////////////////////////

document.addEventListener(
"keydown",
(e)=>{

if(e.key==="f" && inPlane){

inPlane = false;

parachute.visible = true;

player.position.copy(
plane.position
);

}

if(e.key==="1") gunType="AK";

if(e.key==="2") gunType="SNIPER";

if(e.key==="e"){

if(
player.position.distanceTo(
car.position
)<5
){

driving = !driving;

}

}

}
);

//////////////////////////////
// JUMP
//////////////////////////////

document.getElementById(
"jump"
).onclick=()=>{

if(player.position.y<=1.01){

velocityY = 0.25;

}

};

//////////////////////////////
// SHOOT
//////////////////////////////

document.getElementById(
"shoot"
).onclick=()=>{

gunSound.currentTime = 0;

gunSound.play();

const speed =
gunType==="SNIPER" ? 1 : 0.5;

const bullet = new THREE.Mesh(

new THREE.SphereGeometry(0.2),

new THREE.MeshBasicMaterial({
color:0xffff00
})

);

bullet.position.copy(
player.position
);

scene.add(bullet);

function animateBullet(){

bullet.position.z -= speed;

enemies.forEach(
(enemy,index)=>{

if(
enemy &&
bullet.position.distanceTo(
enemy.position
)<1
){

scene.remove(enemy);

enemies[index]=null;

kills++;

updateHUD();

}

});

requestAnimationFrame(
animateBullet
);

}

animateBullet();

};

//////////////////////////////
// HUD
//////////////////////////////

function updateHUD(){

document.getElementById(
"hud"
).innerHTML=
`
HP: ${Math.floor(hp)}<br>
Kills: ${kills}<br>
Gun: ${gunType}<br>
Zone: ${Math.floor(zoneSize)}
`;

}

//////////////////////////////
// GAME SYSTEMS
//////////////////////////////

function checkLoot(){

lootBoxes.forEach(
(loot,index)=>{

if(
loot &&
player.position.distanceTo(
loot.position
)<2
){

scene.remove(loot);

lootBoxes[index]=null;

}

});

}

function checkMedkits(){

medkits.forEach(
(medkit,index)=>{

if(
medkit &&
player.position.distanceTo(
medkit.position
)<2
){

scene.remove(medkit);

medkits[index]=null;

hp += 25;

if(hp>100) hp=100;

updateHUD();

}

});

}

function checkZoneDamage(){

const dist = Math.sqrt(
player.position.x*
player.position.x +
player.position.z*
player.position.z
);

if(dist > zoneSize){

hp -= 0.05;

if(hp<0) hp=0;

updateHUD();

}

}

function updateEnemies(){

enemies.forEach((enemy)=>{

if(enemy){

const dx =
player.position.x -
enemy.position.x;

const dz =
player.position.z -
enemy.position.z;

enemy.position.x += dx * 0.001;

enemy.position.z += dz * 0.001;

}

});

}

function updatePlane(){

if(inPlane){

plane.position.z -= 0.3;

player.position.copy(
plane.position
);

camera.position.x =
player.position.x;

camera.position.y =
player.position.y + 5;

camera.position.z =
player.position.z + 15;

camera.lookAt(player.position);

}

}

function updateParachute(){

if(
!inPlane &&
parachute.visible
){

if(player.position.y > 2){

player.position.y -= 0.05;

parachute.position.copy(
player.position
);

parachute.position.y += 4;

}else{

parachute.visible = false;

}

}

}

function updateAirDrop(){

if(airDrop.position.y>1){

airDrop.position.y -= 0.05;

}

}

function handleMovement(){

if(moveX!==0 || moveZ!==0){

if(walkSound.paused){

walkSound.play();

}

}else{

walkSound.pause();

}

}

//////////////////////////////
// FPS
//////////////////////////////

const fpsCounter =
document.createElement("div");

fpsCounter.style.position="fixed";
fpsCounter.style.bottom="10px";
fpsCounter.style.left="10px";
fpsCounter.style.color="white";
fpsCounter.style.zIndex="30";

document.body.appendChild(
fpsCounter
);

let lastTime = performance.now();

function updateFPS(){

const now = performance.now();

const fps = Math.round(
1000/(now-lastTime)
);

lastTime = now;

fpsCounter.innerHTML =
"FPS: " + fps;

}

//////////////////////////////
// MINI MAP
//////////////////////////////

const miniMap =
document.createElement("div");

miniMap.style.position="fixed";
miniMap.style.top="10px";
miniMap.style.right="10px";
miniMap.style.width="150px";
miniMap.style.height="150px";
miniMap.style.background=
"rgba(0,0,0,0.5)";
miniMap.style.border=
"2px solid white";
miniMap.style.borderRadius=
"10px";
miniMap.style.zIndex="20";

document.body.appendChild(
miniMap
);

//////////////////////////////
// ANIMATE
//////////////////////////////

function animate(){

requestAnimationFrame(
animate
);

handleMovement();

checkLoot();

checkMedkits();

checkZoneDamage();

updateEnemies();

updatePlane();

updateParachute();

updateAirDrop();

updateFPS();

if(!inPlane){

if(driving){

car.position.x += moveX;

car.position.z += moveZ;

player.position.copy(
car.position
);

player.position.y = 2;

}else{

player.position.x += moveX;

player.position.z += moveZ;

}

}

velocityY += gravity;

player.position.y += velocityY;

if(player.position.y<1){

player.position.y=1;

velocityY=0;

}

camera.position.x =
player.position.x;

camera.position.z =
player.position.z + 8;

camera.lookAt(
player.position
);

renderer.render(
scene,
camera
);

}

updateHUD();

animate();

//////////////////////////////
// RESIZE
//////////////////////////////

window.addEventListener(
"resize",
()=>{

camera.aspect =
window.innerWidth /
window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

}
);

</script>

</body>
</html>
